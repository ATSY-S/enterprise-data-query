[mysqld]
# MySQL 8.0 配置 —— 供 Windows 服务 MYSQL80 使用
# 程序目录: D:\123
# 配置位置: C:\ProgramData\MySQL\MySQL Server 8.0\my.ini

basedir=D:/123
datadir=C:/ProgramData/MySQL/MySQL Server 8.0/Data
port=3306
character-set-server=utf8mb4
collation-server=utf8mb4_unicode_ci
default-authentication-plugin=mysql_native_password

# 服务运行账号 NetworkService 需要对 datadir 有完全控制权限
# 若启动仍失败，见下方初始化步骤中的 icacls 命令

log-error=C:/ProgramData/MySQL/MySQL Server 8.0/Data/mysql.err
max_connections=100
innodb_buffer_pool_size=128M

[client]
port=3306
default-character-set=utf8mb4
